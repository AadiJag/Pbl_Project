    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}EcoHarvest | Smart Crop Recommendation{% endblock %}</title>
        <meta name="description" content="{% block meta_desc %}EcoHarvest — Precision crop recommendation powered by machine learning for smarter agriculture.{% endblock %}">
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <!-- Navigation -->
        <nav class="main-nav" id="mainNav">
            <div class="nav-inner">
                <a href="{{ url_for('home') }}" class="nav-logo">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EcoHarvest Logo" class="nav-logo-img">
                    <span class="logo-text">EcoHarvest</span><span class="logo-dot">.</span>
                </a>
                <div class="nav-links" id="navLinks">
                    <a href="{{ url_for('home') }}" class="nav-link {% if active_page == 'home' %}active{% endif %}">
                        <i class="fa-solid fa-house"></i> Home
                    </a>
                    <a href="{{ url_for('predict_page') }}" class="nav-link {% if active_page == 'predict' %}active{% endif %}">
                        <i class="fa-solid fa-seedling"></i> Predict
                    </a>
                    <a href="{{ url_for('about') }}" class="nav-link {% if active_page == 'about' %}active{% endif %}">
                        <i class="fa-solid fa-circle-info"></i> About
                    </a>
                </div>
                <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </nav>

        <!-- Page Content -->
        <main class="page-content">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="footer-inner">
                <div class="footer-brand">
                    <span class="logo-text">EcoHarvest</span><span class="logo-dot">.</span>
                    <p class="footer-tagline">Precision Agriculture, Simplified</p>
                </div>
                <div class="footer-links">
                    <a href="{{ url_for('home') }}">Home</a>
                    <a href="{{ url_for('predict_page') }}">Predict</a>
                    <a href="{{ url_for('about') }}">About</a>
                </div>
                <div class="footer-copy">
                    <p>&copy; 2026 EcoHarvest &mdash; Built with Python &amp; Flask</p>
                </div>
            </div>
        </footer>

        <!-- Shared Scripts -->
        <script>
            window.addEventListener('scroll', () => {
                document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 40);
            });
            document.getElementById('navToggle').addEventListener('click', () => {
                document.getElementById('navLinks').classList.toggle('nav-open');
            });

            // Scroll reveal
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(el => el.isIntersecting && el.target.classList.add('revealed'));
            }, { threshold: 0.12 });
            document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
        </script>

        {% block scripts %}{% endblock %}
    </body>
    </html>
